<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time Jar — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; background: #efe6d4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #3a2e22; }
    .back-btn { position: fixed; top: 16px; left: 16px; min-width: 44px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 34px; line-height: 1; color: #4a3b2c; background: rgba(255,255,255,0.3); border-radius: 8px; text-decoration: none; transition: all 200ms ease; z-index: 900; }
    .back-btn:hover { background: rgba(255,255,255,0.5); transform: scale(1.05); }

    .dashboard__header { padding: 32px 40px 0; max-width: 900px; margin: 0 auto; text-align: center; }
    .dashboard__title { font-family: 'Nanum Pen Script', cursive; font-weight: 400; font-size: 44px; color: #3a2e22; margin: 0; }
    .dashboard__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; row-gap: 36px; padding: 32px 40px; max-width: 1180px; margin: 0 auto; box-sizing: border-box; }

    .jar-card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 24px 16px 40px; background: transparent; border: none; color: #3a2e22; text-decoration: none; cursor: pointer; transition: transform 0.2s; }
    .jar-card:hover { transform: translateY(-4px); }
    .jar-card::before { content: ''; position: absolute; top: 110px; left: -10px; right: -10px; height: 7px; border-radius: 40% 60% 50% 50% / 60% 40% 60% 40%; background: radial-gradient(ellipse 30% 100% at 30% 50%, rgba(170,145,110,0.35), rgba(170,145,110,0) 80%), rgba(170,145,110,0.22); }

    .jar-card__thumb--jar { position: relative; width: 60px; height: 90px; overflow: hidden; z-index: 1; }
    .jar-card__thumb-bottle { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; z-index: 2; }
    .jar-card__thumb-flowers-clip { position: absolute; bottom: 0; left: 0; right: 0; overflow: hidden; z-index: 1; }
    .jar-card__thumb-flowers { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; object-fit: contain; object-position: bottom; }

    .jar-card__note { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; margin-top: 10px; padding: 7px 16px 6px; background: #f3e9d2 url('assets/note_paper.png') center/cover; box-shadow: 0 1px 1px rgba(90,70,45,0.12), 0 4px 8px rgba(90,70,45,0.16); }
    .jar-card__name { font-family: 'Nanum Pen Script', cursive; font-weight: 400; font-size: 24px; line-height: 1.1; color: #3a2e22; }
    .jar-card__progress { font-family: 'Nanum Pen Script', cursive; font-size: 19px; line-height: 1; color: #7a6a55; margin-top: 4px; }

    .jar-card--new { justify-content: center; border: 1.5px dashed rgba(150,128,98,0.45); border-radius: 12px; min-height: 180px; background: transparent; font-family: inherit; color: #5f955f; }
    .jar-card--new::before { display: none; }
    .jar-card--new:hover { transform: none; }
    .jar-card--new__plus { font-size: 32px; line-height: 1; }
    .jar-card--new__label { font-size: 14px; color: #7a6a55; }

    .empty-msg { grid-column: 1 / -1; text-align: center; color: #7a6a55; }

    /* Create-jar popup: theme first, then name (same order and look as Claude Design) */
    #create-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.25); display: none; align-items: center; justify-content: center; z-index: 9999; }
    #create-modal.show { display: flex; }
    .modal-card { width: calc(100% - 48px); max-width: 420px; box-sizing: border-box; padding: 36px 32px; border-radius: 20px; text-align: center; background: linear-gradient(150deg, rgba(239,230,212,0.9) 0%, rgba(230,236,222,0.9) 100%); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 24px 60px rgba(74,83,68,0.3); }
    .modal-title { font-family: 'Nanum Pen Script', cursive; font-weight: 400; font-size: 34px; line-height: 1.1; margin: 0 0 24px; color: #353b30; }
    .modal-step { display: none; }
    .modal-step.active { display: block; }
    .theme-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 28px; }
    .theme-option { display: flex; align-items: center; justify-content: center; height: 64px; border-radius: 14px; border: 2px solid transparent; cursor: pointer; background: rgba(255,255,255,0.35); transition: all 150ms; }
    .theme-option img { max-width: 44px; max-height: 44px; object-fit: contain; }
    .theme-option.selected { border-color: #5f955f; background: rgba(255,255,255,0.7); }
    .name-input { width: 100%; padding: 14px 16px; border: none; border-radius: 12px; font-size: 18px; box-sizing: border-box; margin-bottom: 28px; background: rgba(255,255,255,0.45); outline: none; }
    .modal-actions { display: flex; gap: 12px; }
    .modal-btn { flex: 1; padding: 12px 20px; font-size: 16px; font-weight: 600; border-radius: 25px; cursor: pointer; border: none; }
    .modal-btn.secondary { background: rgba(255,255,255,0.45); color: #353b30; border: 1px solid rgba(255,255,255,0.75); }
    .modal-btn.primary { background: rgba(143,191,138,0.85); color: #fff; box-shadow: 0 4px 14px rgba(90,138,90,0.3); }
  </style>
</head>
<body>
  <div class="page dashboard">
    <a class="back-btn" href="welcome.html" aria-label="Back" title="Back">&lsaquo;</a>
    <header class="dashboard__header">
      <h1 class="dashboard__title">Your projects</h1>
    </header>

    <main class="dashboard__grid" id="jars-grid"></main>

    <div style="max-width:1180px;margin:0 auto;padding:0 40px 40px;box-sizing:border-box">
      <button class="jar-card jar-card--new" id="open-create" type="button" style="width:100%;max-width:220px">
        <span class="jar-card--new__plus">+</span>
        <span class="jar-card--new__label">Create New Project</span>
      </button>
    </div>
  </div>

  <div id="create-modal">
    <div class="modal-card">
      <div class="modal-step active" id="step-theme">
        <h2 class="modal-title">What would you put in your time jar?</h2>
        <div class="theme-grid" id="theme-grid"></div>
        <div class="modal-actions">
          <button class="modal-btn secondary" id="theme-cancel" type="button">Cancel</button>
          <button class="modal-btn primary" id="theme-next" type="button">Next</button>
        </div>
      </div>

      <div class="modal-step" id="step-name">
        <h2 class="modal-title">What are you putting your time into?</h2>
        <input class="name-input" id="jar-name" type="text" placeholder="e.g. Deep Work">
        <div class="modal-actions">
          <button class="modal-btn secondary" id="name-back" type="button">Back</button>
          <button class="modal-btn primary" id="name-create" type="button">Create Jar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://rkyawxfzfueqfgzgkkkt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_29NoCpu3W89C8fueHo5_Rw_QWcnY48w';

    // Same order and icons as the Claude Design theme picker
    const THEMES = [
      { id: 'flowers',   name: 'Flowers',   icon: 'assets/fl_1.png' },
      { id: 'water',     name: 'Water',     svg: '<svg viewBox="0 0 40 48" width="34" height="40"><path d="M20 2 C20 2 4 22 4 32 A16 16 0 0 0 36 32 C36 22 20 2 20 2 Z" fill="#3d8fd1"/><ellipse cx="13" cy="28" rx="3" ry="6" fill="#a9d6f5" opacity="0.8" transform="rotate(20 13 28)"/></svg>' },
      { id: 'dandelion', name: 'Dandelion', icon: 'assets/dandelion_seed.png' },
      { id: 'feathers',  name: 'Feathers',  icon: 'assets/feather_1.png' },
      { id: 'orange',    name: 'Orange',    icon: 'assets/orange_slice.png' },
      { id: 'plant',     name: 'Plant',     icon: 'assets/plant_eucalyptus.png' },
      { id: 'bamboo',    name: 'Bamboo',    icon: 'assets/plant_bamboo.png' },
      { id: 'maple',     name: 'Maple',     icon: 'assets/maple_1.png' },
      { id: 'cranes',    name: 'Cranes',    icon: 'assets/crane_1.png' },
      { id: 'envelopes', name: 'Envelopes', icon: 'assets/envelope_2.png' }
    ];
    const NOTE_TILTS = [-3, 2, -2, 1.5, -1];

    // Which page each theme opens. Flowers uses jar.html (the version confirmed working).
    function jarPage(type) {
      return 'jar.html'; // temporary: every jar opens the working Flowers page until the other themes are confirmed
    }

    let sbClient;
    let selectedTheme = null;

    document.addEventListener('DOMContentLoaded', async () => {
      sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { storage: localStorage, autoRefreshToken: true, persistSession: true, detectSessionInUrl: false }
      });

      const { data: { user } } = await sbClient.auth.getUser();
      if (!user) { window.location.href = 'welcome.html'; return; }

      renderThemeGrid();
      document.getElementById('open-create').addEventListener('click', openCreateModal);
      document.getElementById('theme-cancel').addEventListener('click', closeCreateModal);
      document.getElementById('theme-next').addEventListener('click', goToNameStep);
      document.getElementById('name-back').addEventListener('click', goToThemeStep);
      document.getElementById('name-create').addEventListener('click', createJar);
      await renderJars(user.id);
    });

    function renderThemeGrid() {
      document.getElementById('theme-grid').innerHTML = THEMES.map(t => `
        <div class="theme-option" data-theme="${t.id}" title="${t.name}">
          ${t.icon ? `<img src="${t.icon}" alt="${t.name}">` : t.svg}
        </div>
      `).join('');
      document.querySelectorAll('.theme-option').forEach(el => {
        el.addEventListener('click', () => {
          document.querySelectorAll('.theme-option').forEach(e => e.classList.remove('selected'));
          el.classList.add('selected');
          selectedTheme = el.dataset.theme;
        });
      });
    }

    function showStep(id) {
      document.querySelectorAll('.modal-step').forEach(s => s.classList.toggle('active', s.id === id));
    }

    function openCreateModal() {
      selectedTheme = null;
      document.querySelectorAll('.theme-option').forEach(e => e.classList.remove('selected'));
      document.getElementById('jar-name').value = '';
      showStep('step-theme');
      document.getElementById('create-modal').classList.add('show');
    }

    function closeCreateModal() {
      document.getElementById('create-modal').classList.remove('show');
    }

    function goToNameStep() {
      if (!selectedTheme) { alert('Choose a jar first'); return; }
      showStep('step-name');
      document.getElementById('jar-name').focus();
    }

    function goToThemeStep() { showStep('step-theme'); }

    async function createJar() {
      const name = document.getElementById('jar-name').value.trim();
      if (!name) { alert('Please enter a name'); return; }
      const { data: { user } } = await sbClient.auth.getUser();
      const { data, error } = await sbClient
        .from('user_jars')
        .insert({ user_id: user.id, custom_name: name, jar_type: selectedTheme, created_at: new Date().toISOString() })
        .select('id')
        .single();
      if (error) {
        if (error.code === '23505' || /duplicate key/i.test(error.message)) {
          alert('You already have a jar called "' + name + '". Please choose a different name.');
        } else {
          alert('Failed to create jar: ' + error.message);
        }
        return;
      }
      window.location.href = `${jarPage(selectedTheme)}?id=${data.id}`;
    }

    // Progress shown on each jar comes from the same saved state the jar page writes
    function readJarProgress(jarId) {
      try {
        const raw = localStorage.getItem(`timejar_state_${jarId}`);
        if (!raw) return { minutes: 0, percent: 0 };
        const d = JSON.parse(raw);
        return {
          minutes: Number(d.totalMinutesInvested) || 0,
          percent: Math.max(0, Math.min(100, Number(d.fillPercent) || 0))
        };
      } catch (e) { return { minutes: 0, percent: 0 }; }
    }

    function formatTimeLabel(totalMinutes) {
      const h = Math.floor(totalMinutes / 60);
      const m = totalMinutes % 60;
      return h <= 0 ? `${m}m` : `${h}h ${m}m`;
    }

    async function renderJars(userId) {
      const grid = document.getElementById('jars-grid');
      const { data: jars, error } = await sbClient
        .from('user_jars')
        .select('*')
        .eq('user_id', userId)
        .order('created_at', { ascending: false });
      if (error) { console.error('Error loading jars:', error); return; }

      const cards = (jars || []).map((jar, i) => {
        const p = readJarProgress(jar.id);
        const tilt = NOTE_TILTS[i % NOTE_TILTS.length];
        return `
          <a class="jar-card" href="${jarPage(jar.jar_type)}?id=${jar.id}">
            <div class="jar-card__thumb--jar">
              <img class="jar-card__thumb-bottle" src="assets/bottle.png" alt="">
              <div class="jar-card__thumb-flowers-clip" style="height:${p.percent}%">
                <img class="jar-card__thumb-flowers" src="assets/jar-thumb-flowers-full.png" alt="">
              </div>
            </div>
            <div class="jar-card__note" style="transform:rotate(${tilt}deg)">
              <div class="jar-card__name">${jar.custom_name}</div>
              <div class="jar-card__progress">${formatTimeLabel(p.minutes)}</div>
            </div>
          </a>`;
      }).join('');

      grid.innerHTML = cards || '<p class="empty-msg">No projects yet. Create one to get started!</p>';
    }
  </script>
</body>
</html>
