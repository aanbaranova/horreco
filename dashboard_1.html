<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horreco — Your Projects</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Cormorant+Garamond:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #f4f7f3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .dashboard { padding: 20px; max-width: 1200px; margin: 0 auto; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; }
    .header h1 { margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 48px; color: #2c3e2f; }
    .back-btn { position: fixed; top: 16px; left: 16px; background: rgba(255,255,255,0.3); border: none; padding: 8px 16px; border-radius: 8px; font-size: 24px; cursor: pointer; transition: all 200ms; z-index: 100; }
    .back-btn:hover { background: rgba(255,255,255,0.5); transform: scale(1.05); }
    
    .jars-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .jar-card { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: all 200ms; cursor: pointer; text-decoration: none; color: #2c3e2f; display: flex; flex-direction: column; }
    .jar-card:hover { transform: translateY(-4px); box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
    .jar-name { font-weight: 600; margin-bottom: 8px; }
    .jar-progress { font-size: 14px; color: #666; }
    
    .create-jar-btn { background: #5f955f; color: white; border: none; padding: 16px 32px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 200ms; align-self: flex-start; }
    .create-jar-btn:hover { background: #4a7d4a; transform: scale(1.02); }
    
    /* Modal styles */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .modal { background: white; border-radius: 20px; padding: 40px; max-width: 500px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .modal h2 { margin: 0 0 24px; font-family: 'Nanum Pen Script', cursive; font-size: 32px; color: #2c3e2f; }
    .modal p { margin: 0 0 24px; color: #666; }
    
    .jar-picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
    .jar-option { border: 2px solid #ddd; border-radius: 12px; padding: 16px; text-align: center; cursor: pointer; transition: all 200ms; background: #f9f9f9; }
    .jar-option:hover { border-color: #5f955f; background: #f0f7f0; }
    .jar-option.selected { border-color: #5f955f; background: #e8f5e9; }
    .jar-option-icon { font-size: 32px; margin-bottom: 8px; }
    .jar-option-name { font-size: 13px; font-weight: 500; color: #2c3e2f; }
    
    .name-input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; margin-bottom: 24px; }
    .name-input:focus { outline: none; border-color: #5f955f; box-shadow: 0 0 0 3px rgba(95,149,95,0.1); }
    
    .modal-buttons { display: flex; gap: 12px; justify-content: flex-end; }
    .modal-btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: all 200ms; }
    .modal-btn.cancel { background: #eee; color: #333; }
    .modal-btn.cancel:hover { background: #ddd; }
    .modal-btn.submit { background: #5f955f; color: white; }
    .modal-btn.submit:hover { background: #4a7d4a; }
  </style>
</head>
<body>
  <a class="back-btn" href="welcome.html">&lsaquo;</a>
  
  <div class="dashboard">
    <div class="header">
      <h1>Your Projects</h1>
    </div>

    <div id="jars-grid" class="jars-grid">
      <!-- Jars will load here from Supabase -->
    </div>

    <button class="create-jar-btn" onclick="openCreateModal()">+ Create New Project</button>
  </div>

  <!-- Theme Picker Modal -->
  <div id="create-modal" class="modal-overlay">
    <div class="modal">
      <h2>What are you putting your time into?</h2>
      <p>Choose a theme that fits your project:</p>
      
      <div class="jar-picker">
        <div class="jar-option" data-type="flowers" onclick="selectJarType('flowers', this)">
          <div class="jar-option-icon">🌸</div>
          <div class="jar-option-name">Flowers</div>
        </div>
        <div class="jar-option" data-type="maple" onclick="selectJarType('maple', this)">
          <div class="jar-option-icon">🍂</div>
          <div class="jar-option-name">Maple</div>
        </div>
        <div class="jar-option" data-type="water" onclick="selectJarType('water', this)">
          <div class="jar-option-icon">💧</div>
          <div class="jar-option-name">Water</div>
        </div>
        <div class="jar-option" data-type="dandelion" onclick="selectJarType('dandelion', this)">
          <div class="jar-option-icon">🌼</div>
          <div class="jar-option-name">Dandelion</div>
        </div>
        <div class="jar-option" data-type="feathers" onclick="selectJarType('feathers', this)">
          <div class="jar-option-icon">🪶</div>
          <div class="jar-option-name">Feathers</div>
        </div>
        <div class="jar-option" data-type="cranes" onclick="selectJarType('cranes', this)">
          <div class="jar-option-icon">🦅</div>
          <div class="jar-option-name">Cranes</div>
        </div>
        <div class="jar-option" data-type="envelopes" onclick="selectJarType('envelopes', this)">
          <div class="jar-option-icon">✉️</div>
          <div class="jar-option-name">Envelopes</div>
        </div>
        <div class="jar-option" data-type="orange" onclick="selectJarType('orange', this)">
          <div class="jar-option-icon">🍊</div>
          <div class="jar-option-name">Orange</div>
        </div>
        <div class="jar-option" data-type="plant" onclick="selectJarType('plant', this)">
          <div class="jar-option-icon">🌿</div>
          <div class="jar-option-name">Plant</div>
        </div>
      </div>

      <input type="text" class="name-input" id="jar-name" placeholder="e.g. Deep Work" />

      <div class="modal-buttons">
        <button class="modal-btn cancel" onclick="closeCreateModal()">Cancel</button>
        <button class="modal-btn submit" onclick="createJar()">Create Jar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://rkyawxfzfueqfgzgkkkt.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJreWF3eGZ6ZnVlcWZnemdramt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjQ2Njc5NDEsImV4cCI6MjA0MDI0Mzk0MX0.vgKBz3hHx8hFMJm7ux7XdX5RI5zWY85yTQJSb6s4BM8';

    if (!window.horrecoSupabase) {
      window.horrecoSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }
    const supabase = window.horrecoSupabase;

    let selectedJarType = 'flowers';

    function openCreateModal() {
      document.getElementById('create-modal').classList.add('active');
    }

    function closeCreateModal() {
      document.getElementById('create-modal').classList.remove('active');
      document.getElementById('jar-name').value = '';
      selectedJarType = 'flowers';
      document.querySelectorAll('.jar-option').forEach(el => el.classList.remove('selected'));
    }

    function selectJarType(type, element) {
      selectedJarType = type;
      document.querySelectorAll('.jar-option').forEach(el => el.classList.remove('selected'));
      element.classList.add('selected');
    }

    async function createJar() {
      const jarName = document.getElementById('jar-name').value.trim();
      if (!jarName) {
        alert('Please enter a project name');
        return;
      }

      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        alert('Please sign in first');
        return;
      }

      const { data, error } = await supabase
        .from('user_jars')
        .insert({
          user_id: user.id,
          jar_name: jarName,
          jar_type: selectedJarType,
          created_at: new Date().toISOString()
        })
        .select('id')
        .single();

      if (error) {
        console.error('Error creating jar:', error);
        alert('Failed to create jar');
        return;
      }

      closeCreateModal();
      window.location.href = `jar.html?type=${selectedJarType}&id=${data.id}`;
    }

    async function loadUserJars() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        window.location.href = 'welcome.html';
        return;
      }

      const { data: jars, error } = await supabase
        .from('user_jars')
        .select('id, jar_name, jar_type, created_at')
        .eq('user_id', user.id)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Error loading jars:', error);
        return;
      }

      const grid = document.getElementById('jars-grid');
      if (jars.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #666;">No projects yet. Create one to get started!</p>';
        return;
      }

      grid.innerHTML = jars.map(jar => `
        <a href="jar.html?type=${jar.jar_type}&id=${jar.id}" class="jar-card">
          <div class="jar-name">${jar.jar_name}</div>
          <div class="jar-progress">Click to continue</div>
        </a>
      `).join('');
    }

    // Load jars when page loads
    loadUserJars();
  </script>
</body>
</html>
