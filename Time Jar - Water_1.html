<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; }
    @keyframes timeModalIn { 0% { opacity: 0; transform: scale(0.92) translateY(10px); filter: blur(8px); } 100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); } }
    @keyframes dropFall {
      0% { transform: translate(-50%, 0) scale(0.85, 1.1); opacity: 1; }
      62% { transform: translate(-50%, var(--dropSurfaceY)) scale(1, 1.05); opacity: 1; }
      100% { transform: translate(-50%, var(--dropFinalY)) scale(0.75, 0.75); opacity: 0; }
    }
    @keyframes bubbleRise {
      0% { transform: translateY(0) scale(0.8); opacity: 0.9; }
      10% { transform: translateY(calc(var(--riseDistance, 32px) * -0.1)) scale(1); opacity: 1; }
      85% { transform: translateY(calc(var(--riseDistance, 32px) * -0.9)) scale(1); opacity: 1; }
      100% { transform: translateY(calc(var(--riseDistance, 32px) * -1)) scale(1); opacity: 0; }
    }
    @keyframes bubbleSettleIn {
      0% { transform: scale(0.6); opacity: 0.5; }
      60% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes bubbleIdleBob {
      0%, 100% { transform: translate(0, 0); }
      33% { transform: translate(1.5px, -3px); }
      66% { transform: translate(-1.5px, -1.5px); }
    }
    @keyframes waveIdleBob {
      0% { transform: translate(0, 0); }
      25% { transform: translate(3px, -1.5px); }
      50% { transform: translate(0, -0.5px); }
      75% { transform: translate(-3px, -1.8px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes rippleRing {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0.7; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }
  </style>
</helmet>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <clipPath id="waterSilhouetteClip" clipPathUnits="userSpaceOnUse">
      <path d="M 100 8 Q 122 12, 122 16 Q 122 34, 122 50 Q 133 59, 144 68 Q 154 80, 164 92 Q 168 106, 168 120 Q 168 142, 168 164 L 168 270 Q 168 288, 156 294 Q 148 298, 136 298 L 64 298 Q 52 298, 44 294 Q 32 288, 32 270 L 32 164 Q 32 142, 32 120 Q 32 106, 36 92 Q 46 80, 56 68 Q 67 59, 78 50 Q 78 34, 78 16 Q 78 12, 100 8 Z"></path>
    </clipPath>
  </defs>
</svg>
<div ref="{{pageRef}}" style="width:100%;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#ebe6d8;isolation:isolate;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:auto;position:relative">
  <sc-if value="{{showBackdrop}}" hint-placeholder-val="{{true}}">
    <div aria-hidden="true" style="position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:#f3eee2">
      <div style="position:absolute;inset:-60px;filter:blur(14px);opacity:0.58;background:radial-gradient(ellipse 55% 45% at 18% 22%, rgba(150,180,200,0.6), rgba(150,180,200,0) 70%), radial-gradient(ellipse 50% 50% at 82% 30%, rgba(160,200,195,0.55), rgba(160,200,195,0) 70%), radial-gradient(ellipse 60% 45% at 30% 80%, rgba(170,200,205,0.5), rgba(170,200,205,0) 70%), radial-gradient(ellipse 45% 40% at 78% 82%, rgba(140,170,195,0.5), rgba(140,170,195,0) 70%), radial-gradient(ellipse 60% 50% at 52% 50%, rgba(246,236,214,0.95), rgba(246,236,214,0) 72%), radial-gradient(ellipse 45% 35% at 40% 12%, rgba(244,232,208,0.85), rgba(244,232,208,0) 70%), linear-gradient(170deg, #ece9df 0%, #f2ecde 50%, #e9e8de 100%)"></div>
    </div>
  </sc-if>
  <sc-if value="{{showBackLink}}" hint-placeholder-val="{{true}}">
    <a href="dashboard.html" aria-label="Back to projects" title="Back" style="position:fixed;top:16px;left:16px;min-width:44px;min-height:44px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:4px 16px 8px;font-size:34px;line-height:1;font-weight:400;color:#4a3b2c;background:rgba(255,255,255,0.3);border:none;border-radius:8px;text-decoration:none;cursor:pointer;transition:all 200ms ease;z-index:900" style-hover="background:rgba(255,255,255,0.5);transform:scale(1.05)">&lsaquo;</a>
  </sc-if>
  <div ref="{{containerRef}}" style="position:relative;width:400px;height:540px;background:transparent;border-radius:20px;box-shadow:none">
    <div style="position:absolute;top:18px;left:50%;transform:translateX(-50%) rotate(-5deg);width:132px;height:84px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 90% 70% at 28% 22%, rgba(255,253,245,0.35) 0%, rgba(255,253,245,0) 70%), url('./assets/note_paper.png') center / cover, #ece3cf;border-radius:1px;box-shadow:inset -1px -1px 0 rgba(150,130,95,0.35), inset 1px 1px 0 rgba(255,255,255,0.5), 1px 1px 0 rgba(170,150,115,0.55), 2px 2px 0 rgba(150,130,95,0.35), 3px 10px 14px -4px rgba(70,55,35,0.32);z-index:200"><span style="font-family:'Nanum Pen Script',cursive;font-size:34px;line-height:1;color:#2b2622;letter-spacing:0.5px;transform:rotate(1deg)">{{timeLabel}}</span></div>

    <div style="position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:200px;height:300px;z-index:2">
      <img src="./assets/bottle_clear.png" alt="jar" style="position:relative;display:block;width:100%;height:100%;object-fit:contain;object-position:bottom;z-index:1">
    </div>

    <!-- accumulated bubbles: each landed drop becomes ONE permanent bubble that stays here,
         so the jar visually fills with bubbles over time instead of a rising water band.
         Unclipped layer (proven reliable pattern in this file — clip-path silently hid content
         here earlier), bubble x/y kept inside the glass via widthAt() math instead. -->
    <div ref="{{permanentBubbleFieldRef}}" style="position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:200px;height:300px;z-index:4;pointer-events:none"></div>

    <div ref="{{dropLayerRef}}" style="position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:200px;height:300px;z-index:4;pointer-events:none;overflow:visible;clip:rect(-80px,220px,320px,-20px)"></div>

    <div style="position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:200px;height:300px;z-index:5;pointer-events:none">
      <div style="position:absolute;inset:0;mix-blend-mode:screen;opacity:0.85;clip-path:polygon(50% 8%, 57% 8%, 57% 26%, 74% 38%, 84% 50%, 85.5% 78%, 85% 88%, 82% 94%, 76% 97.5%, 68% 99.3%, 59% 99.9%, 50% 100%, 41% 99.9%, 32% 99.3%, 24% 97.5%, 18% 94%, 15% 88%, 14.5% 78%, 16% 50%, 26% 38%, 43% 26%, 43% 8%);background:linear-gradient(100deg, rgba(255,255,255,1) 0%, rgba(255,255,255,0.55) 7%, rgba(255,255,255,0) 22%, rgba(255,255,255,0) 100%)"></div>
      <div style="position:absolute;inset:0;opacity:0.85;clip-path:polygon(50% 8%, 57% 8%, 57% 26%, 74% 38%, 84% 50%, 85.5% 78%, 85% 88%, 82% 94%, 76% 97.5%, 68% 99.3%, 59% 99.9%, 50% 100%, 41% 99.9%, 32% 99.3%, 24% 97.5%, 18% 94%, 15% 88%, 14.5% 78%, 16% 50%, 26% 38%, 43% 26%, 43% 8%);background:linear-gradient(100deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.08) 13%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 56%, rgba(90,110,135,0.32) 78%, rgba(20,30,42,0.68) 100%), linear-gradient(90deg, rgba(10,16,24,0.6) 0%, rgba(10,16,24,0) 9%, rgba(10,16,24,0) 91%, rgba(10,16,24,0.65) 100%)"></div>
    </div>

    <button onClick="{{openTimeModal}}" style="position:absolute;bottom:4px;left:50%;transform:translateX(-50%);padding:12px 26px;font-family:'Nanum Pen Script',cursive;font-size:26px;line-height:1;color:#2b2622;letter-spacing:0.5px;background:radial-gradient(ellipse 90% 70% at 28% 22%, rgba(255,253,245,0.35) 0%, rgba(255,253,245,0) 70%), url('./assets/note_paper.png') center / cover, #ece3cf;border:1px solid rgba(150,130,95,0.35);border-radius:2px;cursor:pointer;box-shadow:inset 1px 1px 0 rgba(255,255,255,0.5), 1px 1px 0 rgba(170,150,115,0.45), 2px 6px 10px -4px rgba(70,55,35,0.28);transition:transform .2s, box-shadow .2s;z-index:100" style-hover="transform:translateX(-50%) translateY(-1px);box-shadow:inset 1px 1px 0 rgba(255,255,255,0.5), 1px 1px 0 rgba(170,150,115,0.45), 3px 9px 14px -4px rgba(70,55,35,0.34)">Add Time</button>
  </div>

  <sc-if value="{{showTimeModal}}" hint-placeholder-val="{{false}}">
    <div style="position:fixed;top:0;left:0;width:100%;height:100%;background:transparent;z-index:1000;display:flex;justify-content:center;align-items:center">
      <div style="background:linear-gradient(150deg, rgba(200,230,245,0.08) 0%, rgba(150,200,225,0.04) 30%, rgba(100,170,210,0.05) 65%, rgba(60,140,190,0.08) 100%);backdrop-filter:blur(24px) saturate(1.8);border:1px solid rgba(255,255,255,0.85);border-top-color:rgba(255,255,255,1);border-radius:20px;padding:36px 40px;text-align:center;box-shadow:0 28px 70px rgba(30,90,130,0.45), 0 1px 0 rgba(255,255,255,0.6), inset 0 4px 6px rgba(255,255,255,0.95), inset 0 -6px 10px rgba(20,80,110,0.35), inset 6px 0 7px rgba(255,255,255,0.45), inset -4px 0 6px rgba(20,80,110,0.15);max-width:340px;opacity:0;animation:timeModalIn 2.8s cubic-bezier(.16,1,.3,1) forwards">
        <p style="font-size:14px;color:#2f6580;margin:0 0 24px">How long were you in the flow?</p>
        <div style="display:flex;gap:16px;justify-content:center;margin-bottom:26px">
          <div style="display:flex;flex-direction:column;align-items:flex-start;gap:6px">
            <label style="font-size:12px;color:#2f6580;font-weight:600">Hours</label>
            <input ref="{{hoursInputRef}}" type="number" min="0" placeholder="0" style="width:90px;padding:10px 12px;font-size:16px;border:1px solid #ddd;border-radius:10px;outline:none;color:#1f4d63">
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-start;gap:6px">
            <label style="font-size:12px;color:#2f6580;font-weight:600">Minutes</label>
            <input ref="{{minInputRef}}" type="number" min="0" placeholder="0" style="width:90px;padding:10px 12px;font-size:16px;border:1px solid #ddd;border-radius:10px;outline:none;color:#1f4d63">
          </div>
        </div>
        <div style="display:flex;gap:12px;justify-content:center">
          <button onClick="{{closeTimeModal}}" style="flex:1;padding:12px 20px;font-size:15px;font-weight:600;border:none;border-radius:25px;cursor:pointer;background:#f0f0f0;color:#555">Cancel</button>
          <button onClick="{{submitTime}}" style="flex:1;padding:12px 20px;font-size:15px;font-weight:600;color:#fff;border:none;border-radius:25px;cursor:pointer;background:linear-gradient(150deg, rgba(120,190,225,0.6) 0%, rgba(50,140,185,0.65) 100%);box-shadow:0 4px 15px rgba(40,120,160,0.25)">Add</button>
        </div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{showModal}}" hint-placeholder-val="{{false}}">
    <div style="position:fixed;top:0;left:0;width:100%;height:100%;background:transparent;z-index:1000;display:flex;justify-content:center;align-items:center">
      <div style="background:linear-gradient(150deg, rgba(235,230,216,0.62) 0%, rgba(150,180,200,0.34) 100%);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,255,255,0.7);border-top-color:rgba(255,255,255,0.9);border-radius:20px;padding:40px;text-align:center;box-shadow:0 24px 60px rgba(68,81,90,0.3), inset 0 4px 6px rgba(255,255,255,0.6), inset 0 -6px 10px rgba(75,90,100,0.15);max-width:380px;width:calc(100% - 48px);box-sizing:border-box">
        <h2 style="font-family:'Nanum Pen Script', cursive;font-weight:400;font-size:44px;line-height:1;margin:0 0 12px;color:rgb(48,58,64)">{{milestoneTitle}}</h2>
        <p style="font-size:15px;color:rgba(68,81,90,1);margin:0 0 28px">{{milestoneMessage}}</p>
        <div style="display:flex;gap:12px;justify-content:center">
          <button onClick="{{startNewRound}}" style="flex:1;padding:12px 20px;font-size:15px;font-weight:600;border:1px solid rgba(255,255,255,0.75);border-radius:25px;cursor:pointer;background:rgba(255,255,255,0.45);color:rgb(48,58,64)">Start New Round</button>
          <button onClick="{{continueRound}}" style="flex:1;padding:12px 20px;font-size:15px;font-weight:600;color:#fff;border:none;border-radius:25px;cursor:pointer;background:rgba(90,108,120,0.88);box-shadow:0 4px 14px rgba(75,90,100,0.3)">Keep Going</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>


<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:680},&quot;milestoneTarget&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:400,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:50,&quot;max&quot;:2000,&quot;step&quot;:50},&quot;fallSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0.4,&quot;max&quot;:2,&quot;step&quot;:0.1}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.pageRef = React.createRef();
    this.containerRef = React.createRef();
    this.waterLayerRef = React.createRef();
    this.waterBodyRef = React.createRef();
    this.waterFillRef = React.createRef();
    this.permanentBubbleFieldRef = React.createRef();
    this.dropLayerRef = React.createRef();
    this.surfaceLineRef = React.createRef();
    this.waveWrapperRef = React.createRef();
    this.minInputRef = React.createRef();
    this.hoursInputRef = React.createRef();
    this.state = { fillPercent: 0, showModal: false, showTimeModal: false, totalMinutesInvested: 0 };
    this.currentRoundUnits = 0;
    this.landedUnits = 0;
    this.isCompressing = false;
    this.FLOOR_Y = 448;
    this.NECK_Y = 290;
    // root cause of "51% looks like 26% full": MAX_PILE previously stopped at NECK_Y (290),
    // leaving the neck/shoulder (a third of the jar-art box's 300px height) permanently unusable
    // headspace — so 100% fill only ever reached ~53% of the box's visible height. Cap fill near
    // the very top of the visible glass instead, so 100% fill reads as visually full.
    // the hand-placed clip silhouette's usable opening only spans local y=8 (top, a closed point)
    // to y=198 — MAX_PILE previously computed to 323px, taller than that entire usable range (and
    // taller than the 300px box itself), letting the surface (and the wave riding on it) push up
    // into/past the neck's near-zero-width point at very high fill. Cap it inside that real range.
    this.MAX_PILE = 175;
    this.currentHeight = 0;
    // the bubble field box's own local y=0 (its bottom edge) sits 32px BELOW the bottle art's
    // true visible floor (box bottom is at abs y=480 in the 540-tall card; FLOOR_Y=448 is where
    // the glass actually appears to end) — bubbles placed at local y=0..~10 were rendering in
    // that transparent-PNG dead zone below the visible glass, reading as "outside the jar".
    this.FLOOR_OFFSET = 22;
    this.permanentBubbles = [];
    this.bubbleColumns = new Array(9).fill(0); // per-column stacked height, like the flower jar's pile
    this.storageKey = 'timejar_state_deep-work-water';
    { const qid = new URLSearchParams(window.location.search).get('id'); if (qid && /^[\w-]+$/.test(qid)) this.storageKey = 'timejar_state_' + qid; }
  }

  componentDidMount() {
    this.restoreState();
    if (window.location.search.indexOf('thumb=1') !== -1 && this.pageRef.current) {
      this.pageRef.current.style.background = 'transparent';
    }
  }

  setWaterFillHeight = (h, animate) => {
    const fill = this.waterFillRef.current;
    if (!fill) return;
    const clamped = Math.max(0, Math.min(this.MAX_PILE, h));
    fill.style.transition = animate ? 'height 0.5s cubic-bezier(.4,0,.2,1), width 0.5s cubic-bezier(.4,0,.2,1), left 0.5s cubic-bezier(.4,0,.2,1)' : 'none';
    const trueH = clamped > 0 ? clamped + this.FLOOR_OFFSET : 0;
    fill.style.height = trueH + 'px';
    // width/left sized dynamically from the SAME widthAt() taper table the glass follows (not a
    // fixed box) — a static width was wider than the real glass opening at low fill and spilled
    // out past the curve
    const midAbsY = this.FLOOR_Y - clamped / 2;
    const w = trueH > 0 ? Math.min(160, this.widthAt(midAbsY) * 2 - 6) : 0;
    fill.style.width = w + 'px';
    fill.style.left = (100 - w / 2) + 'px';
  };

  makeBubbleNode = (size, x, y) => {
    const b = document.createElement('div');
    b.style.position = 'absolute';
    b.style.left = `calc(50% + ${x}px)`;
    b.style.bottom = (y + this.FLOOR_OFFSET) + 'px';
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.borderRadius = '50%';
    b.style.background = 'radial-gradient(circle at 32% 28%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.35) 22%, rgba(255,255,255,0.05) 45%, rgba(255,255,255,0) 65%)';
    b.style.boxShadow = 'inset -1px -1.5px 2px rgba(60,100,110,0.3), inset 1px 1.5px 2px rgba(255,255,255,0.6)';
    b.style.animation = `bubbleIdleBob ${2.3 + Math.random() * 1.2}s ease-in-out infinite ${Math.random() * 1.5}s`;
    return b;
  };

  // called once a drop's fall+sink finishes: it becomes ONE permanent bubble that stays in the
  // jar forever, packing into the currently-filled region — this is what makes the jar visually
  // fill up with bubbles over time instead of a rising water level
  landBubble = (dx, dropNode, deltaH) => {
    // give some bubbles a "closer to the front glass" read: slightly bigger, brighter highlight,
    // and nudged toward center-x (where the glass curves closest to the viewer) rather than the
    // sides — a cheap depth cue since this layer has no real z-axis to place them behind/in front
    const isForeground = Math.random() < 0.35;
    const size = (isForeground ? 7 : 5) + Math.random() * 6;
    // stack into columns (like the flower jar's pile) instead of sampling y from currentHeight —
    // that approach permanently trapped early bubbles near 0px since currentHeight was still
    // tiny when they landed. Pick the column with the LEAST accumulated height (occasionally a
    // random one, for natural irregularity) so bubbles pack evenly bottom-up with no overlap.
    const cols = this.bubbleColumns;
    let colIdx;
    if (Math.random() < 0.55) {
      colIdx = 0;
      for (let i = 1; i < cols.length; i++) if (cols[i] < cols[colIdx]) colIdx = i;
    } else {
      colIdx = Math.floor(Math.random() * cols.length);
    }
    // the drawn bubble SIZE is purely cosmetic; how much the column actually grows is the
    // volume-correct deltaH (from the same curve the flower jar uses), so the pile height always
    // matches the real fraction of the target however many drops land — growing by the bubble's
    // own fixed diameter instead made the jar look half full at a small fraction of the target.
    const growth = Math.max(deltaH, 0.15);
    const y = Math.min(this.MAX_PILE - 3, cols[colIdx] + growth / 2 + 3);
    cols[colIdx] = Math.min(this.MAX_PILE, y + growth / 2);
    const colFrac = (colIdx + 0.5) / cols.length; // 0..1 across the jar's width
    const halfW = Math.max(6, this.glassHalfWidthAtLocalY(y + this.FLOOR_OFFSET) - size / 2 - 2);
    const x = (colFrac - 0.5) * 2 * halfW * (isForeground ? 0.7 : 1.15) + (Math.random() - 0.5) * 10;
    // the drop itself BECOMES the bubble — restyle the same node in place instead of removing
    // it and spawning a separate element, so there's no disappear/reappear gap. Its two prior
    // .animate() calls are still active with fill:'forwards', continuing to hold a `transform`
    // that combined with the new left/bottom to shove it far off (sometimes down near the
    // button) — cancel them and clear the transform before repurposing the node.
    dropNode.getAnimations().forEach(a => a.cancel());
    dropNode.style.transform = 'none';
    const field = this.permanentBubbleFieldRef.current;
    if (!dropNode || !field) return;
    field.appendChild(dropNode);
    dropNode.style.left = `calc(50% + ${x}px)`;
    dropNode.style.bottom = (y + this.FLOOR_OFFSET) + 'px';
    dropNode.style.top = '';
    dropNode.style.width = size + 'px';
    dropNode.style.height = size + 'px';
    dropNode.style.borderRadius = '50%';
    dropNode.style.background = isForeground
      ? 'radial-gradient(circle at 32% 28%, rgba(255,255,255,1) 0%, rgba(255,255,255,0.5) 24%, rgba(255,255,255,0.08) 48%, rgba(255,255,255,0) 68%)'
      : 'radial-gradient(circle at 32% 28%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.35) 22%, rgba(255,255,255,0.05) 45%, rgba(255,255,255,0) 65%)';
    dropNode.style.boxShadow = isForeground
      ? 'inset -1.5px -2px 3px rgba(60,100,110,0.35), inset 1.5px 2px 3px rgba(255,255,255,0.75)'
      : 'inset -1px -1.5px 2px rgba(60,100,110,0.3), inset 1px 1.5px 2px rgba(255,255,255,0.6)';
    dropNode.style.opacity = '1';
    dropNode.getAnimations().forEach(a => a.cancel());
    // avoid Animation.onfinish entirely (confirmed unreliable in this preview elsewhere in this
    // file) — a single CSS `animation` shorthand runs the settle-bounce once then the idle bob
    // loop forever, with no JS callback needed to "close out" the bounce and restore opacity
    const bobDelay = Math.random() * 1.5;
    dropNode.style.animation = `bubbleSettleIn 380ms cubic-bezier(.34,1.56,.64,1) ${bobDelay}s 1 both, bubbleIdleBob ${2.3 + Math.random() * 1.2}s ease-in-out infinite ${bobDelay + 0.38}s`;
    this.permanentBubbles.push({ size, x, y });
  };

  buildVolumeTable() {
    if (this.volumeTable) return this.volumeTable;
    const steps = 200;
    const dh = this.MAX_PILE / steps;
    const table = [{ h: 0, cum: 0 }];
    let cum = 0;
    for (let i = 1; i <= steps; i++) {
      const h = i * dh;
      const r = this.glassHalfWidthAtLocalY(h + this.FLOOR_OFFSET);
      cum += r * r * dh;
      table.push({ h, cum });
    }
    const total = cum || 1;
    table.forEach(row => row.frac = row.cum / total);
    this.volumeTable = table;
    return table;
  }

  // % must map to actual jar VOLUME, not raw height — this jar is wide at the bottom, so a
  // linear height% reads as already-half-full at a low %. Same fix already applied to the
  // flower jar's pile.
  heightForFraction(t) {
    const table = this.buildVolumeTable();
    if (t <= 0) return 0;
    if (t >= 1) return this.MAX_PILE;
    for (let i = 1; i < table.length; i++) {
      if (table[i].frac >= t) {
        const a = table[i - 1], b = table[i];
        const span = b.frac - a.frac;
        const p = span > 0 ? (t - a.frac) / span : 0;
        return a.h + (b.h - a.h) * p;
      }
    }
    return this.MAX_PILE;
  }

  spawnRipple = (dx, bottomPx) => {
    const field = this.permanentBubbleFieldRef.current;
    if (!field) return;
    // clamp each ring's x so it can't render past the actual glass wall at this height (this
    // layer isn't clipped to the jar silhouette, so nothing else was keeping the side rings
    // inside the bottle) — same real-silhouette lookup already used for bubble placement
    const halfW = Math.max(10, this.glassHalfWidthAtLocalY(bottomPx) - 8);
    const clampX = (x, ringHalfW) => Math.max(-halfW + ringHalfW, Math.min(halfW - ringHalfW, x));
    const offsets = [
      { x: clampX(dx, 20), w: 40, h: 13, op: 0.9 },
      { x: clampX(dx - 42, 31), w: 62, h: 18, op: 0.6 },
      { x: clampX(dx + 42, 31), w: 62, h: 18, op: 0.6 },
    ];
    offsets.forEach(o => {
      const ring = document.createElement('div');
      ring.style.position = 'absolute';
      ring.style.left = `calc(50% + ${o.x}px)`;
      ring.style.bottom = (bottomPx - o.h / 2 + 5) + 'px';
      ring.style.width = o.w + 'px';
      ring.style.height = o.h + 'px';
      ring.style.marginLeft = (-o.w / 2) + 'px';
      ring.style.border = `2px solid rgba(180,205,215,${o.op})`;
      ring.style.borderRadius = '50%';
      ring.style.pointerEvents = 'none';
      ring.style.zIndex = '10';
      ring.style.boxShadow = `0 0 3px rgba(255,255,255,${o.op * 0.6})`;
      ring.style.animation = 'rippleRing 650ms ease-out forwards';
      field.appendChild(ring);
      setTimeout(() => ring.remove(), 700);
    });
  };

  saveState = () => {
    const data = {
      currentRoundUnits: this.currentRoundUnits,
      landedUnits: this.landedUnits,
      fillPercent: this.state.fillPercent,
      totalMinutesInvested: this.state.totalMinutesInvested,
      lastMilestoneShown: this.lastMilestoneShown || 0,
      carryMinutes: this.carryMinutes || 0,
      currentHeight: this.currentHeight,
      // cap what's persisted too — otherwise this array grows every session and every future
      // mount re-pays the cost of restoring (and now slicing) an ever-larger stored list
      permanentBubbles: this.permanentBubbles.slice(-200),
      bubbleColumns: this.bubbleColumns,
    };
    try { localStorage.setItem(this.storageKey, JSON.stringify(data)); } catch (e) {}
  };

  restoreState = () => {
    let data;
    try { data = JSON.parse(localStorage.getItem(this.storageKey) || 'null'); } catch (e) { data = null; }
    if (!data) return;
    this.currentRoundUnits = data.currentRoundUnits || 0;
    this.landedUnits = data.landedUnits || 0;
    const fillPercent = data.fillPercent || 0;
    this.currentHeight = (typeof data.currentHeight === 'number' && data.currentHeight > 0)
      ? data.currentHeight
      : (fillPercent / 100) * this.MAX_PILE;
    this.permanentBubbles = Array.isArray(data.permanentBubbles) ? data.permanentBubbles : [];
    this.bubbleColumns = Array.isArray(data.bubbleColumns) ? data.bubbleColumns : new Array(9).fill(0);
    // self-heal leftover state from before "Keep Going" compacted the pile: if the saved
    // counters were reset (low fillPercent) but the pile itself is still sitting near/at
    // MAX_PILE, it never actually went through compaction — compact it now so a stale save
    // doesn't render as "0% but the jar looks full"
    const pileMax = Math.max(0, ...this.bubbleColumns);
    if (fillPercent < 50 && pileMax > this.MAX_PILE * 0.6) {
      const healCompact = 0.32;
      this.bubbleColumns = this.bubbleColumns.map(h => h * healCompact);
      this.permanentBubbles = this.permanentBubbles.map(b => ({ ...b, y: b.y * healCompact }));
    }
    // hard clamp: stale saves from earlier FLOOR_OFFSET/MAX_PILE recalibrations this session
    // could still exceed the CURRENT MAX_PILE even after the heal above — rescale proportionally
    // so bubbles never render past the jar's real top/neck opening
    const pileMaxAfterHeal = Math.max(0, ...this.bubbleColumns);
    if (pileMaxAfterHeal > this.MAX_PILE) {
      const clampScale = this.MAX_PILE / pileMaxAfterHeal;
      this.bubbleColumns = this.bubbleColumns.map(h => h * clampScale);
      this.permanentBubbles = this.permanentBubbles.map(b => ({ ...b, y: b.y * clampScale }));
    }
    // recompute from the REAL restored pile, not the stored (possibly stale) value — same
    // formula addDrop uses, so the surface reference is always derived from the actual bubbles
    this.currentHeight = Math.max(0, ...this.bubbleColumns);
    this.setWaterFillHeight(this.currentHeight, false);
    const field = this.permanentBubbleFieldRef.current;
    if (field) {
      // root cause of the page-hang: this session's testing accumulated an unbounded
      // permanentBubbles array (hundreds+ entries) in localStorage, and mount synchronously
      // created one DOM node per entry via appendChild — cap how many are actually restored/
      // rendered (visually a full jar reads the same with far fewer bubbles) so mount can never
      // block the thread regardless of how large old stored state has grown
      const MAX_RESTORED_BUBBLES = 140;
      const toRender = this.permanentBubbles.length > MAX_RESTORED_BUBBLES
        ? this.permanentBubbles.slice(-MAX_RESTORED_BUBBLES)
        : this.permanentBubbles;
      toRender.forEach(b => field.appendChild(this.makeBubbleNode(b.size, b.x, b.y)));
    }
    this.setState({ fillPercent, totalMinutesInvested: data.totalMinutesInvested || 0 });
    this.lastMilestoneShown = data.lastMilestoneShown || 0;
    this.carryMinutes = Number.isFinite(data.carryMinutes) ? data.carryMinutes : 0;
    {
      const reachedCap = Math.floor((data.totalMinutesInvested || 0) / ((this.props.milestoneTarget ?? 400) * 30));
      if (this.lastMilestoneShown > reachedCap) this.lastMilestoneShown = reachedCap;
    }
    // already past a milestone that never got its pop-up (e.g. 201h) — show it now
    const reachedNow = Math.floor((data.totalMinutesInvested || 0) / ((this.props.milestoneTarget ?? 400) * 30));
    if (reachedNow > this.lastMilestoneShown && window.location.search.indexOf('thumb=1') === -1) {
      setTimeout(() => { if ((this.state.totalMinutesInvested || 0) >= reachedNow * (this.props.milestoneTarget ?? 400) * 30) { this.lastMilestoneShown = reachedNow; this.setState({ showModal: true }); this.saveState(); } }, 1200);
    }
    this.saveState();
  };

  formatTimeLabel(totalMinutes) {
    const h = Math.floor(totalMinutes / 60);
    const m = totalMinutes % 60;
    if (h <= 0) return `${m}m`;
    return `${h}h ${m}m`;
  }

  // real glass half-width at a given LOCAL y measured from the jar-art box's own bottom edge
  // (0 = box bottom, 300 = box top) — taken directly from the SAME silhouette points already
  // used for this bottle art's glass-shading clip-paths elsewhere in this file (proven visually
  // accurate), instead of a guessed pile-height fraction that didn't match where the real glass
  // actually narrows.
  glassHalfWidthAtLocalY(yFromBottom) {
    const yPct = ((300 - yFromBottom) / 300) * 100;
    const pts = [
      [2, 50], [5, 60], [26, 60], [38, 74], [50, 84], [78, 85.5], [88, 85],
      [94, 82], [97.5, 76], [99.3, 68], [99.9, 59], [100, 50],
    ];
    let xPct = pts[pts.length - 1][1];
    if (yPct <= pts[0][0]) {
      xPct = pts[0][1];
    } else if (yPct < pts[pts.length - 1][0]) {
      for (let i = 0; i < pts.length - 1; i++) {
        const [y0, x0] = pts[i], [y1, x1] = pts[i + 1];
        if (yPct >= y0 && yPct <= y1) {
          const t = (yPct - y0) / (y1 - y0);
          xPct = x0 + (x1 - x0) * t;
          break;
        }
      }
    }
    return Math.max(4, ((xPct - 50) / 100) * 200);
  }

  // same volume-aware mapping as the flower jar: % maps to actual jar volume, not raw height,
  // so the wide body doesn't visually under-fill relative to its stated percent
  widthAt(y) {
    const table = this.WIDTH_TABLE || (this.WIDTH_TABLE = [
      [50, 60], [150, 45], [200, 36], [240, 30], [270, 27],
      [290, 26.6], [296, 22.4], [302, 22.0], [308, 22.2], [314, 22.2],
      [320, 22.6], [326, 24.0], [335, 30.4], [344, 45.6], [350, 54.0],
      [356, 60.6], [365, 68.0], [374, 73.2], [380, 75.6], [410, 79.4], [510, 78.8],
      [518, 76.0], [524, 68.0], [528, 58.0],
    ]);
    if (y < table[0][0]) return 999;
    if (y >= table[table.length - 1][0]) return table[table.length - 1][1];
    for (let i = 0; i < table.length - 1; i++) {
      const [y0, h0] = table[i], [y1, h1] = table[i + 1];
      if (y >= y0 && y <= y1) {
        const t = (y - y0) / (y1 - y0);
        return h0 + (h1 - h0) * t;
      }
    }
    return 79;
  }

  openTimeModal = () => {
    if (this.isCompressing || this.state.showModal) return;
    this.setState({ showTimeModal: true });
  };

  closeTimeModal = () => {
    this.setState({ showTimeModal: false });
  };

  submitTime = () => {
    const mins = parseInt(this.minInputRef.current.value, 10) || 0;
    const hrs = parseInt(this.hoursInputRef.current.value, 10) || 0;
    this.setState({ showTimeModal: false });
    this.addMinutes(hrs * 60 + mins);
  };

  // a round holds exactly one milestone; extra time waits in carryMinutes for the next round
  addMinutes = (entered) => {
    if (!(entered > 0)) return;
    const M = (this.props.milestoneTarget ?? 400) * 30;
    const room = Math.max(0, ((this.lastMilestoneShown || 0) + 1) * M - (this.state.totalMinutesInvested || 0));
    const totalMinutes = Math.min(entered, room);
    this.carryMinutes = (this.carryMinutes || 0) + (entered - totalMinutes);
    if (totalMinutes <= 0) { this.saveState(); if (!this.milestonePending) { this.lastMilestoneShown = Math.floor((this.state.totalMinutesInvested || 0) / M); this.setState({ showModal: true }); } return; }
    this.setState(s => ({ totalMinutesInvested: (s.totalMinutesInvested || 0) + totalMinutes }), () => this.saveState());
    const dropCount = Math.max(1, Math.ceil(totalMinutes / 30));
    for (let i = 0; i < dropCount; i++) {
      setTimeout(() => this.addDrop(), i * 1500);
    }
    // milestone pop-up is driven by time (200h, 400h, 600h…), shown once the drops have landed
    const milestoneMinutes = (this.props.milestoneTarget ?? 400) * 30;
    const newTotal = (this.state.totalMinutesInvested || 0) + totalMinutes;
    const reached = Math.floor(newTotal / milestoneMinutes);
    if (reached > (this.lastMilestoneShown || 0) && !this.milestonePending) {
      // only marked as shown when it actually opens — leaving mid-drop keeps it pending, so it
      // opens on the next visit instead of being silently skipped
      this.milestonePending = true;
      const landing = Math.min(dropCount, Math.max(0, (this.props.milestoneTarget ?? 400) - this.currentRoundUnits));
      setTimeout(() => {
        this.milestonePending = false;
        if ((this.state.totalMinutesInvested || 0) < reached * milestoneMinutes) return;
        this.lastMilestoneShown = reached;
        this.setState({ showModal: true }); this.saveState();
      }, landing * 1500 + 3500);
    }
  };

  addDrop = () => {
    const milestoneTarget = this.props.milestoneTarget ?? 400;
    if (this.state.showModal || this.currentRoundUnits >= milestoneTarget) return;
    this.currentRoundUnits++;
    const tBefore = Math.min(1, (this.currentRoundUnits - 1) / milestoneTarget);
    const tAfter = Math.min(1, this.currentRoundUnits / milestoneTarget);
    const newHeight = this.heightForFraction(tAfter);
    // how much the pile should visually grow from THIS drop — driven by the same jar-volume
    // curve the flower jar uses, not by the bubble's own fixed pixel diameter. Fixed-size
    // circles stacking by their own height ignored milestoneTarget entirely, so the jar looked
    // half full at a small fraction of the actual target instead of tracking real progress.
    const deltaH = this.heightForFraction(tAfter) - this.heightForFraction(tBefore);
    // capture the surface level as it is RIGHT NOW, before this drop's own contribution — the
    // ripple represents impact on the EXISTING surface, and the surface itself only rises to
    // newHeight once the drop actually lands (a few hundred ms later), not at click time
    const oldHeight = this.currentHeight;
    const willRipple = this.permanentBubbles.length > 0;

    const dropLayer = this.dropLayerRef.current;
    const drop = document.createElement('div');
    const size = 8 + Math.random() * 3;
    const dx = (Math.random() - 0.5) * 14;
    const startY = -60;
    const surfaceY = Math.max(40, 300 - 60 - this.currentHeight - 4);
    const sinkDepth = Math.min(38, this.currentHeight * 0.55 + 8);
    const finalY = Math.min(280, surfaceY + sinkDepth);
    drop.style.position = 'absolute';
    drop.style.left = `calc(50% + ${dx}px)`;
    drop.style.top = '0';
    drop.style.width = size + 'px';
    drop.style.height = size + 'px';
    drop.style.borderRadius = '50%';
    drop.style.background = 'radial-gradient(circle at 32% 28%, rgba(255,255,255,0.95) 0%, rgba(210,225,230,0.5) 35%, rgba(160,190,200,0.4) 70%)';
    drop.style.boxShadow = 'inset -1px -2px 3px rgba(90,120,130,0.4)';
    if (dropLayer) dropLayer.appendChild(drop);
    // two SEPARATE, explicitly-timed animations instead of one CSS curve spanning both phases —
    // a single easing across fall+sink was decelerating too early, reading as a pause right
    // before the surface. Phase 1 falls straight down at a fast constant pace with no slowdown
    // until it truly reaches the water; phase 2 (starting exactly at impact) is the slower sink.
    const fallDuration = 500 / (this.props.fallSpeed ?? 1);
    const sinkDuration = 550 / (this.props.fallSpeed ?? 1);
    drop.animate([
      { transform: `translate(-50%, ${startY}px) scale(0.85,1.1)` },
      { transform: `translate(-50%, ${surfaceY}px) scale(1,1.05)` },
    ], { duration: fallDuration, easing: 'linear', fill: 'forwards' });
    // NOTE: Animation.onfinish does not reliably fire in this preview environment (confirmed via
    // an isolated test — even a trivial animate().onfinish never called back), so drive the
    // fall→sink handoff with setTimeout(fallDuration) instead, which is reliable everywhere.
    setTimeout(() => {
      // ripple fires HERE — the instant the drop visually reaches the surface — not after the
      // slower sink-and-settle phase that follows
      if (willRipple) this.spawnRipple(dx, oldHeight + this.FLOOR_OFFSET);
      const midY = surfaceY + (finalY - surfaceY) * 0.65;
      drop.animate([
        { transform: `translate(-50%, ${surfaceY}px) scale(1,1.05)`, opacity: 1, offset: 0 },
        { transform: `translate(-50%, ${midY}px) scale(0.9,0.95)`, opacity: 1, offset: 0.65 },
        { transform: `translate(-50%, ${finalY}px) scale(0.75,0.75)`, opacity: 0, offset: 1 },
      ], { duration: sinkDuration, easing: 'cubic-bezier(.15,.6,.35,1)', fill: 'forwards' });
    }, fallDuration);
    const dropDuration = fallDuration + sinkDuration;

    setTimeout(() => {
      this.landBubble(dx, drop, deltaH);
      // the "surface" (used for ripple positioning and where the NEXT drop's fall animation
      // targets) must track the REAL bubble pile, not an independent ideal fill curve — that
      // mismatch let the actual pile grow taller than where the ripple/ surface line appeared
      this.currentHeight = Math.max(0, ...this.bubbleColumns);
      this.setWaterFillHeight(newHeight, true);
      this.landedUnits++;
      const landedPercent = Math.min(100, Math.round((this.landedUnits / milestoneTarget) * 100));
      this.setState({ fillPercent: landedPercent });
      this.saveState();

    }, dropDuration);
  };

  startNewRound = () => {
    { const carry = this.carryMinutes || 0; if (carry > 0) setTimeout(() => { if ((this.carryMinutes || 0) !== carry) return; this.carryMinutes = 0; this.addMinutes(carry); }, 900); }
    const field = this.permanentBubbleFieldRef.current;
    if (field) field.innerHTML = '';
    this.permanentBubbles = [];
    this.bubbleColumns = new Array(9).fill(0);
    this.currentRoundUnits = 0;
    this.landedUnits = 0;
    this.currentHeight = 0;
    this.setWaterFillHeight(0, true);
    this.setState({ fillPercent: 0, showModal: false });
    this.saveState();
  };

  continueRound = () => {
    { const carry = this.carryMinutes || 0; if (carry > 0) setTimeout(() => { if ((this.carryMinutes || 0) !== carry) return; this.carryMinutes = 0; this.addMinutes(carry); }, 1800); }
    this.setState({ showModal: false });
    setTimeout(() => {
      // compress the bubble pile down, same idea as the flower jar: shrink each column's
      // accumulated height and re-pack the actual bubble nodes to their new, lower positions
      // so there's room to keep filling instead of the pile just sitting maxed-out forever
      const compact = 0.32;
      const field = this.permanentBubbleFieldRef.current;
      if (field) {
        Array.from(field.children).forEach(node => {
          const oldBottom = parseFloat(node.style.bottom) || 0;
          const oldLocalY = oldBottom - this.FLOOR_OFFSET;
          // clamp defensively: a node whose pre-compaction y is stale/out-of-bounds (from an
          // earlier session before today's MAX_PILE clamps existed) could still land above the
          // jar after being scaled by 0.32 — cap the compacted result to the CURRENT MAX_PILE
          const newLocalY = Math.min(this.MAX_PILE * 0.32, oldLocalY * compact);
          node.style.transition = 'bottom 900ms cubic-bezier(.4,0,.2,1)';
          node.style.bottom = (newLocalY + this.FLOOR_OFFSET) + 'px';
        });
      }
      this.bubbleColumns = this.bubbleColumns.map(h => h * compact);
      this.permanentBubbles = this.permanentBubbles.map(b => ({ ...b, y: b.y * compact }));
      this.currentHeight *= compact;
      this.currentRoundUnits = 0;
      this.landedUnits = 0;
      this.setState({ fillPercent: 0 });
      this.saveState();
    }, 350);
  };

  renderVals() {
    const milestoneTarget = this.props.milestoneTarget ?? 400;
    return {
      fillPercent: this.state.fillPercent,
      timeLabel: this.formatTimeLabel(this.state.totalMinutesInvested || 0),
      showModal: this.state.showModal,
      showTimeModal: this.state.showTimeModal,
      milestoneTarget,
      milestoneHoursLabel: `${Math.round(Math.max(1, Math.floor((this.state.totalMinutesInvested || 0) / (milestoneTarget * 30))) * milestoneTarget * 30 / 60)} hours`,
      milestoneTitle: `${Math.round(Math.max(1, Math.floor((this.state.totalMinutesInvested || 0) / (milestoneTarget * 30))) * milestoneTarget * 30 / 60)} hours`,
      milestoneMessage: (() => { const h = Math.round(Math.max(1, Math.floor((this.state.totalMinutesInvested || 0) / (milestoneTarget * 30))) * milestoneTarget * 30 / 60); const fixed = { 200: "You've started something real!", 400: 'Your time is taking shape.', 600: 'Look how much time you\u2019ve made visible.', 800: 'There\u2019s a lot of life in here now.', 1000: 'More of your life has found its place here.' }; const rot = ['Your collection keeps growing.', 'Another layer has been added.', 'Your jar keeps telling its story.', 'Still gathering, piece by piece.']; return fixed[h] || rot[Math.max(0, Math.round((h - 1200) / 200)) % 4]; })(),
      openTimeModal: this.openTimeModal,
      closeTimeModal: this.closeTimeModal,
      submitTime: this.submitTime,
      startNewRound: this.startNewRound,
      continueRound: this.continueRound,
      containerRef: this.containerRef,
      pageRef: this.pageRef,
      showBackLink: window.location.search.indexOf('thumb=1') === -1,
      showBackdrop: window.location.search.indexOf('thumb=1') === -1,
      waterLayerRef: this.waterLayerRef,
      waterBodyRef: this.waterBodyRef,
      dropLayerRef: this.dropLayerRef,
      surfaceLineRef: this.surfaceLineRef,
      waveWrapperRef: this.waveWrapperRef,
      hasEnoughWaterForBubbles: this.currentHeight > 24,
      permanentBubbleFieldRef: this.permanentBubbleFieldRef,
      waterFillRef: this.waterFillRef,
      minInputRef: this.minInputRef,
      hoursInputRef: this.hoursInputRef,
    };
  }
}

</script>
</body>
</html>
