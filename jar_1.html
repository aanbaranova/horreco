<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time Jar</title>
  <style>
    body { margin: 0; background: #f4f7f3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #jar-container { width: 100%; min-height: 100vh; }
    .loading { display: flex; align-items: center; justify-content: center; height: 100vh; color: #666; }
  </style>
</head>
<body>
  <div id="jar-container" class="loading">Loading your jar...</div>

  <script>
    // Map jar type to HTML file
    const jarTypes = {
      'flowers': 'Time Jar - Flowers.html',
      'maple': 'Time Jar - Maple.html',
      'water': 'Time Jar - Water.html',
      'dandelion': 'Time Jar - Dandelion.html',
      'feathers': 'Time Jar - Feathers.html',
      'cranes': 'Time Jar - Cranes.html',
      'envelopes': 'Time Jar - Envelopes.html',
      'orange': 'Time Jar - Orange.html',
      'bamboo': 'Time Jar - Bamboo.html',
      'plant': 'Time Jar - Plant.html'
    };

    // Get jar type from URL
    const params = new URLSearchParams(window.location.search);
    const jarType = params.get('type') || 'flowers';
    const jarId = params.get('id');

    if (!jarTypes[jarType]) {
      document.getElementById('jar-container').innerHTML = `<p>Jar type not found. <a href="dashboard.html">Back to dashboard</a></p>`;
    } else {
      // Load the appropriate jar HTML
      const jarFile = jarTypes[jarType];
      fetch(jarFile)
        .then(response => {
          if (!response.ok) throw new Error('Failed to load jar');
          return response.text();
        })
        .then(html => {
          const container = document.getElementById('jar-container');
          container.classList.remove('loading');
          container.innerHTML = html;

          // If there's an id parameter, pass it to the jar's storage
          if (jarId) {
            // The jar pages check URL params for custom storage keys
            // They'll use the id parameter automatically
          }
        })
        .catch(err => {
          console.error('Error loading jar:', err);
          document.getElementById('jar-container').innerHTML = `
            <div style="text-align: center; padding: 40px;">
              <p>Error loading jar. Please <a href="dashboard.html">go back to dashboard</a></p>
            </div>
          `;
        });
    }
  </script>
</body>
</html>
