<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>

<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <style>
    body { margin: 0; }
    a { color: #6b7d6e; } a:hover { color: #2c4a33; }
    @keyframes timeModalIn { 0% { opacity: 0; transform: scale(0.92) translateY(10px); filter: blur(8px); } 100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); } }
  </style>
</helmet>
<div ref="{{pageRef}}" style="width:100%;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#efe9d8;isolation:isolate;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:auto;position:relative">
  <sc-if value="{{showBackdrop}}" hint-placeholder-val="{{true}}">
    <div aria-hidden="true" style="position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse 60% 50% at 18% 22%, rgba(178,196,160,0.5), rgba(178,196,160,0) 70%), radial-gradient(ellipse 55% 45% at 85% 30%, rgba(200,204,176,0.42), rgba(200,204,176,0) 70%), radial-gradient(ellipse 60% 50% at 78% 85%, rgba(222,204,164,0.5), rgba(222,204,164,0) 70%), radial-gradient(ellipse 55% 45% at 12% 88%, rgba(186,198,164,0.42), rgba(186,198,164,0) 70%), #efe9d8">
      <div style="position:absolute;inset:-60px;filter:blur(9px) saturate(0.5) sepia(0.15);opacity:0.5">
        <img src="./assets/plant_bamboo.png" alt="" style="position:absolute;left:-4%;top:-4%;width:26vmax;transform:rotate(-14deg)">
        <img src="./assets/plant_bamboo.png" alt="" style="position:absolute;right:-2%;top:-6%;width:24vmax;transform:rotate(18deg) scaleX(-1)">
        <img src="./assets/plant_bamboo.png" alt="" style="position:absolute;left:-6%;bottom:-6%;width:26vmax;transform:rotate(8deg) scaleX(-1)">
        <img src="./assets/plant_bamboo.png" alt="" style="position:absolute;right:-6%;bottom:-4%;width:28vmax;transform:rotate(-22deg)">
        <img src="./assets/plant_bamboo.png" alt="" style="position:absolute;left:38%;top:-14%;width:14vmax;transform:rotate(170deg);opacity:0.6">
        <img src="./assets/plant_bamboo.png" alt="" style="position:absolute;left:12%;top:38%;width:11vmax;transform:rotate(48deg);opacity:0.55">
        <img src="./assets/plant_bamboo.png" alt="" style="position:absolute;right:10%;top:40%;width:12vmax;transform:rotate(-44deg) scaleX(-1);opacity:0.55">
      </div>
      <div style="position:absolute;inset:0;background:rgba(244,238,222,0.26)"></div>
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 50%, rgba(70,62,35,0) 55%, rgba(70,62,35,0.2) 100%)"></div>
    </div>
  </sc-if>
  <sc-if value="{{showBackLink}}" hint-placeholder-val="{{true}}">
    <a href="dashboard.html" aria-label="Back to projects" title="Back" style="position:fixed;top:16px;left:16px;min-width:44px;min-height:44px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:4px 16px 8px;font-size:34px;line-height:1;font-weight:400;color:#4a3b2c;background:rgba(255,255,255,0.3);border:none;border-radius:8px;text-decoration:none;cursor:pointer;transition:all 200ms ease;z-index:900" style-hover="background:rgba(255,255,255,0.5);transform:scale(1.05)">&lsaquo;</a>
  </sc-if>
  <div style="position:relative;width:400px;height:560px;background:transparent;border-radius:20px;box-shadow:none">
    <div style="position:absolute;top:18px;left:50%;transform:translateX(-50%) rotate(-5deg);width:132px;height:84px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 90% 70% at 28% 22%, rgba(255,253,245,0.35) 0%, rgba(255,253,245,0) 70%), url('./assets/note_paper.png') center / cover, #ece3cf;border-radius:1px;box-shadow:inset -1px -1px 0 rgba(150,130,95,0.35), inset 1px 1px 0 rgba(255,255,255,0.5), 1px 1px 0 rgba(170,150,115,0.55), 2px 2px 0 rgba(150,130,95,0.35), 3px 10px 14px -4px rgba(70,55,35,0.32);z-index:200"><span style="font-family:'Nanum Pen Script',cursive;font-size:34px;line-height:1;color:#2b2622;letter-spacing:0.5px;transform:rotate(1deg)">{{timeLabel}}</span></div>
    <div style="position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:200px;height:300px;z-index:2">
      <img src="./assets/bottle_soil_v2.png" alt="jar" style="position:relative;display:block;width:100%;height:100%;object-fit:contain;object-position:bottom;pointer-events:none;z-index:1">
      <div style="position:absolute;bottom:12px;left:20px;width:160px;height:230px;z-index:3;clip-path:path('M 62,0 L 62,18 C 62,40 10,48 10,78 L 10,206 C 10,218 18,224 32,224 L 128,224 C 142,224 150,218 150,206 L 150,78 C 150,48 98,40 98,18 L 98,0 Z')">
        <div style="position:absolute;left:0;bottom:36px;width:160px;height:194px;overflow:hidden">
          <div ref="{{growRef}}" style="position:absolute;left:0;bottom:0;width:160px;height:194px;transform-origin:80px 100%;transform:scale(0);transition:transform 7s cubic-bezier(.33,0,.2,1)">
            <div ref="{{swayRef}}" style="position:absolute;left:0;bottom:0;width:160px;height:194px;transform-origin:80px 100%">
              <img src="./assets/plant_bamboo.png" alt="lucky bamboo" style="position:absolute;left:36px;bottom:-4px;width:102px;height:194px;pointer-events:none">
            </div>
          </div>
        </div>

      </div>
      <div style="position:absolute;bottom:12px;left:20px;width:160px;height:230px;z-index:4;pointer-events:none;clip-path:path('M 62,0 L 62,18 C 62,40 10,48 10,78 L 10,206 C 10,218 18,224 32,224 L 128,224 C 142,224 150,218 150,206 L 150,78 C 150,48 98,40 98,18 L 98,0 Z');background:radial-gradient(ellipse 42% 5% at 50% 94%, rgba(255,255,255,0.3), rgba(255,255,255,0) 100%), linear-gradient(90deg, rgba(255,255,255,0) 19%, rgba(255,255,255,0.42) 22.5%, rgba(255,255,255,0.16) 26%, rgba(255,255,255,0) 30%), linear-gradient(90deg, rgba(255,255,255,0) 81%, rgba(255,255,255,0.32) 84%, rgba(255,255,255,0) 86.5%), linear-gradient(90deg, rgba(110,165,135,0.38) 6%, rgba(150,195,170,0.1) 17%, rgba(170,210,185,0.05) 50%, rgba(150,195,170,0.1) 83%, rgba(110,165,135,0.38) 94%)"></div>
    </div>
    <button onClick="{{openTimeModal}}" style="position:absolute;bottom:4px;left:50%;transform:translateX(-50%);padding:12px 26px;font-family:'Nanum Pen Script',cursive;font-size:26px;line-height:1;color:#2b2622;letter-spacing:0.5px;background:radial-gradient(ellipse 90% 70% at 28% 22%, rgba(255,253,245,0.35) 0%, rgba(255,253,245,0) 70%), url('./assets/note_paper.png') center / cover, #ece3cf;border:1px solid rgba(150,130,95,0.35);border-radius:2px;cursor:pointer;box-shadow:inset 1px 1px 0 rgba(255,255,255,0.5), 1px 1px 0 rgba(170,150,115,0.45), 2px 6px 10px -4px rgba(70,55,35,0.28);transition:transform .2s, box-shadow .2s;z-index:100" style-hover="transform:translateX(-50%) translateY(-1px);box-shadow:inset 1px 1px 0 rgba(255,255,255,0.5), 1px 1px 0 rgba(170,150,115,0.45), 3px 9px 14px -4px rgba(70,55,35,0.34)">Add Time</button>
  </div>

  <sc-if value="{{showTimeModal}}" hint-placeholder-val="{{false}}">
    <div style="position:fixed;top:0;left:0;width:100%;height:100%;background:transparent;z-index:1000;display:flex;justify-content:center;align-items:center">
      <div style="background:linear-gradient(150deg, rgba(235,250,235,0.05) 0%, rgba(195,225,205,0.03) 30%, rgba(150,195,165,0.04) 65%, rgba(110,160,130,0.06) 100%);backdrop-filter:blur(24px) saturate(1.8);border:1px solid rgba(255,255,255,0.85);border-top-color:rgba(255,255,255,1);border-radius:20px;padding:36px 40px;text-align:center;box-shadow:0 28px 70px rgba(50,100,75,0.45);max-width:340px;opacity:0;animation:timeModalIn 2.8s cubic-bezier(.16,1,.3,1) forwards">
        <p style="font-size:14px;color:#4d6b52;margin:0 0 24px">A little higher. How long did you grow?</p>
        <div style="display:flex;gap:16px;justify-content:center;margin-bottom:26px">
          <div style="display:flex;flex-direction:column;align-items:flex-start;gap:6px">
            <label style="font-size:12px;color:#4d6b52;font-weight:600">Hours</label>
            <input ref="{{hoursInputRef}}" type="number" min="0" placeholder="0" style="width:90px;padding:10px 12px;font-size:16px;border:1px solid #ddd;border-radius:10px;outline:none;color:#2c4a33">
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-start;gap:6px">
            <label style="font-size:12px;color:#4d6b52;font-weight:600">Minutes</label>
            <input ref="{{minInputRef}}" type="number" min="0" placeholder="0" style="width:90px;padding:10px 12px;font-size:16px;border:1px solid #ddd;border-radius:10px;outline:none;color:#2c4a33">
          </div>
        </div>
        <div style="display:flex;gap:12px;justify-content:center">
          <button onClick="{{closeTimeModal}}" style="flex:1;padding:12px 20px;font-size:15px;font-weight:600;border:none;border-radius:25px;cursor:pointer;background:#f0f0f0;color:#555">Cancel</button>
          <button onClick="{{submitTime}}" style="flex:1;padding:12px 20px;font-size:15px;font-weight:600;color:#fff;border:none;border-radius:25px;cursor:pointer;background:linear-gradient(150deg, rgba(143,191,138,0.55) 0%, rgba(95,149,95,0.6) 100%);box-shadow:0 4px 15px rgba(90,138,90,0.25)">Add</button>
        </div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{showModal}}" hint-placeholder-val="{{false}}">
    <div style="position:fixed;top:0;left:0;width:100%;height:100%;background:transparent;z-index:1000;display:flex;justify-content:center;align-items:center">
      <div style="background:linear-gradient(150deg, rgba(239,233,216,0.62) 0%, rgba(178,196,160,0.34) 100%);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,255,255,0.7);border-top-color:rgba(255,255,255,0.9);border-radius:20px;padding:40px;text-align:center;box-shadow:0 24px 60px rgba(80,88,72,0.3), inset 0 4px 6px rgba(255,255,255,0.6), inset 0 -6px 10px rgba(89,98,80,0.15);max-width:380px;width:calc(100% - 48px);box-sizing:border-box">
        <h2 style="font-family:'Nanum Pen Script', cursive;font-weight:400;font-size:44px;line-height:1;margin:0 0 12px;color:rgb(57,63,51)">{{milestoneTitle}}</h2>
        <p style="font-size:15px;color:rgba(80,88,72,1);margin:0 0 28px">{{milestoneMessage}}</p>
        <div style="display:flex;gap:12px;justify-content:center">
          <button onClick="{{startNewRound}}" style="flex:1;padding:12px 20px;font-size:15px;font-weight:600;border:1px solid rgba(255,255,255,0.75);border-radius:25px;cursor:pointer;background:rgba(255,255,255,0.45);color:rgb(57,63,51)">Start New Round</button>
          <button onClick="{{continueRound}}" style="flex:1;padding:12px 20px;font-size:15px;font-weight:600;color:#fff;border:none;border-radius:25px;cursor:pointer;background:rgba(107,118,96,0.88);box-shadow:0 4px 14px rgba(89,98,80,0.3)">Keep Going</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:680},&quot;milestoneHours&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:200,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:10,&quot;max&quot;:1000,&quot;step&quot;:10}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.pageRef = React.createRef();
    this.growRef = React.createRef();
    this.swayRef = React.createRef();
    this.minInputRef = React.createRef();
    this.hoursInputRef = React.createRef();
    this.storageKey = 'timejar_state_bamboo-jar';
    { const qid = new URLSearchParams(window.location.search).get('id'); if (qid && /^[\w-]+$/.test(qid)) this.storageKey = 'timejar_state_' + qid; }
    this.state = { showModal: false, showTimeModal: false, totalMinutesInvested: 0, roundMinutes: 0 };
  }

  get goalMinutes() { return (this.props.milestoneHours ?? 200) * 60; }

  componentDidMount() {
    let data = null;
    try { data = JSON.parse(localStorage.getItem(this.storageKey) || 'null'); } catch (e) {}
    const total = data && Number.isFinite(data.totalMinutesInvested) ? data.totalMinutesInvested : 0;
    const round = data && Number.isFinite(data.roundMinutes) ? data.roundMinutes : total;
    this.carryMinutes = data && Number.isFinite(data.carryMinutes) ? data.carryMinutes : 0;
    this.setState({ totalMinutesInvested: total, roundMinutes: round }, () => this.applyGrowth(false));
    if (window.location.search.indexOf('thumb=1') !== -1 && this.pageRef.current) this.pageRef.current.style.background = 'transparent';
    if (this.swayRef.current) {
      this.swayRef.current.animate(
        [{ transform: 'rotate(-1.1deg)' }, { transform: 'rotate(1.1deg)' }],
        { duration: 4200, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' }
      );
    }
  }

  componentWillUnmount() { clearTimeout(this.popupTimer); clearTimeout(this.sinkTimer); }

  // growth follows the time invested this round; the first entry already shows a sprout tip
  growthFor(mins) {
    const p = Math.min(1, mins / this.goalMinutes);
    return p > 0 ? 0.03 + 0.97 * Math.pow(p, 1.25) : 0;
  }

  applyGrowth(animate) {
    const el = this.growRef.current;
    if (!el) return;
    const g = this.growthFor(this.state.roundMinutes);
    if (!animate) el.style.transition = 'none';
    el.style.transform = g > 0 ? `scale(${g.toFixed(3)})` : 'scale(0)';
    if (!animate) { void el.offsetHeight; el.style.transition = 'transform 7s cubic-bezier(.33,0,.2,1)'; }
  }

  save() {
    const fillPercent = Math.round(Math.min(1, this.state.roundMinutes / this.goalMinutes) * 100);
    try {
      localStorage.setItem(this.storageKey, JSON.stringify({
        v: 1, totalMinutesInvested: this.state.totalMinutesInvested, roundMinutes: this.state.roundMinutes, fillPercent, carryMinutes: this.carryMinutes || 0,
      }));
    } catch (e) {}
  }

  formatTime(m) {
    const h = Math.floor(m / 60), r = m % 60;
    return h > 0 ? `${h}h ${r}m` : `${r}m`;
  }

  openTimeModal = () => { if (!this.state.showModal) this.setState({ showTimeModal: true }); };
  closeTimeModal = () => this.setState({ showTimeModal: false });

  submitTime = () => {
    const mins = Math.max(0, parseInt(this.minInputRef.current && this.minInputRef.current.value, 10) || 0);
    const hrs = Math.max(0, parseInt(this.hoursInputRef.current && this.hoursInputRef.current.value, 10) || 0);
    this.setState({ showTimeModal: false });
    this.addMinutes(hrs * 60 + mins);
  };

  // a round holds exactly one milestone; extra time waits in carryMinutes for the next round
  addMinutes = (entered) => {
    if (!(entered > 0)) return;
    const goal = this.goalMinutes;
    const prev = this.state.roundMinutes;
    const add = Math.min(entered, Math.max(0, goal - prev));
    this.carryMinutes = (this.carryMinutes || 0) + (entered - add);
    if (add <= 0) { this.save(); this.setState({ showModal: true }); return; }
    const next = prev + add;
    this.setState(s => ({ showTimeModal: false, totalMinutesInvested: s.totalMinutesInvested + add, roundMinutes: next }), () => {
      this.applyGrowth(true);
      this.save();
    });
    if (Math.floor(next / goal) > Math.floor(prev / goal)) {
      clearTimeout(this.popupTimer);
      this.popupTimer = setTimeout(() => this.setState({ showModal: true }), 3600);
    }
  };

  startNewRound = () => {
    this.setState({ showModal: false, totalMinutesInvested: 0, roundMinutes: 0 }, () => { this.applyGrowth(true); this.save(); const c = this.carryMinutes || 0; if (c > 0) { this.carryMinutes = 0; setTimeout(() => this.addMinutes(c), 900); } });
  };

  // keep going: after the pop-up closes the grown plant slowly sinks down under the soil,
  // then the round restarts from a fresh sprout (total time is kept)
  continueRound = () => {
    this.setState({ showModal: false });
    const el = this.growRef.current;
    if (!el) { this.setState({ roundMinutes: 0 }, () => this.save()); return; }
    clearTimeout(this.sinkTimer);
    setTimeout(() => {
      const g = this.growthFor(this.state.roundMinutes);
      el.style.transition = 'transform 6s cubic-bezier(.45,0,.35,1)';
      el.style.transform = `translateY(205px) scale(${g.toFixed(3)})`;
      this.sinkTimer = setTimeout(() => {
        el.style.transition = 'none';
        el.style.transform = 'scale(0)';
        void el.offsetHeight;
        el.style.transition = 'transform 7s cubic-bezier(.33,0,.2,1)';
        this.setState({ roundMinutes: 0 }, () => { this.save(); const c = this.carryMinutes || 0; if (c > 0) { this.carryMinutes = 0; setTimeout(() => this.addMinutes(c), 400); } });
      }, 6100);
    }, 450);
  };

  renderVals() {
    const hours = this.props.milestoneHours ?? 200;
    const reached = Math.max(1, Math.floor(this.state.roundMinutes / this.goalMinutes)) * hours * 60;
    return {
      pageRef: this.pageRef, growRef: this.growRef, swayRef: this.swayRef,
      minInputRef: this.minInputRef, hoursInputRef: this.hoursInputRef,
      timeLabel: this.formatTime(this.state.totalMinutesInvested),
      showBackLink: window.location.search.indexOf('thumb=1') === -1,
      showBackdrop: window.location.search.indexOf('thumb=1') === -1,
      showTimeModal: this.state.showTimeModal, showModal: this.state.showModal,
      milestoneTitle: `${Math.round(reached / 60)} hours`,
      milestoneMessage: (() => { const h = Math.round(reached / 60); const fixed = { 200: "You've started something real!", 400: 'Your time is taking shape.', 600: 'Look how much time you\u2019ve made visible.', 800: 'There\u2019s a lot of life in here now.', 1000: 'More of your life has found its place here.' }; const rot = ['Your collection keeps growing.', 'Another layer has been added.', 'Your jar keeps telling its story.', 'Still gathering, piece by piece.']; return fixed[h] || rot[Math.max(0, Math.round((h - 1200) / 200)) % 4]; })(),
      milestoneHoursLabel: `${Math.round(reached / 60)} hours`,
      openTimeModal: this.openTimeModal, closeTimeModal: this.closeTimeModal, submitTime: this.submitTime,
      startNewRound: this.startNewRound, continueRound: this.continueRound,
    };
  }
}
</script>
</body>
</html>
